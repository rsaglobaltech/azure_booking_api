server:
  port: 8080

spring:
  application:
    name: azure-buchungs-api
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ─────────────────────────────────────────────────────────────────────────────
# Microsoft Azure AD / Graph API – Konfiguration
# ─────────────────────────────────────────────────────────────────────────────
azure:
  graph:
    # Azure-AD-Mandanten-ID
    tenant-id: ${AZURE_TENANT_ID:your-tenant-id}
    # Client-ID der in Azure AD registrierten Anwendung
    client-id: ${AZURE_CLIENT_ID:your-client-id}
    # Client-Secret der in Azure AD registrierten Anwendung
    client-secret: ${AZURE_CLIENT_SECRET:your-client-secret}
    # OAuth-2.0-Berechtigungsbereich für Microsoft Graph (wird vom SDK verwendet)
    scope: https://graph.microsoft.com/.default

# ─────────────────────────────────────────────────────────────────────────────
# Microsoft Bookings – Buchungs-URL-Konfiguration
# ─────────────────────────────────────────────────────────────────────────────
buchung:
  # Basis-URL der Microsoft Bookings Selbstbuchungsseite.
  # Die vollständige URL wird dynamisch berechnet:
  #   {buchungs-basis-url}{agenturName}@midominio.com
  # Beispiel: https://outlook.office.com/book/agenturfreiburg@midominio.com
  # Der Agenturname ist IMMER dynamisch und wird aus der Agentur-ID abgeleitet.
  buchungs-basis-url: https://outlook.office.com/book/

  # Mitarbeiter-IDs (GUIDs), die automatisch jedem neuen Termin zugewiesen werden.
  # Leer lassen = Graph API weist keinen bestimmten Mitarbeiter zu.
  # Beispiel:
  #   default-staff-ids:
  #     - 8ee1c803-a1fa-406d-8259-7ab53233f148
  #     - 3fa85f64-5717-4562-b3fc-2c963f66afa6
  default-staff-ids:

# ─────────────────────────────────────────────────────────────────────────────
# Protokollierung (Logging)
# ─────────────────────────────────────────────────────────────────────────────
logging:
  level:
    com.booking: DEBUG
    org.springframework.web: INFO

# ─────────────────────────────────────────────────────────────────────────────
# Actuator – Verwaltungsendpunkte
# ─────────────────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
